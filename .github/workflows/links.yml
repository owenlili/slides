# Weekly check that every deck URL in slides.json still opens.
# A deck that moved (e.g. now returns 404) opens an issue.
name: Check slide URLs

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (09:00 Taiwan)
  push:
    paths:
      - slides.json
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress slides.json
          output: ./lychee/out.md
          fail: false

      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 投影片網址失效
          content-filepath: ./lychee/out.md
          labels: broken-links
