# Daily check that every URL in links.json still opens.
# A broken URL opens an issue, or updates the open one if it already exists.
# The issue is closed once every URL opens again.
name: Check links

on:
  schedule:
    - cron: "0 23 * * *" # Every day 23:00 UTC (07:00 Taiwan)
  push:
    paths:
      - links.json
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # Some sites (e.g. ojs.aaai.org) can take over 30 seconds to respond.
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --timeout 60 --max-retries 3 links.json
          output: ./lychee/out.md
          fail: false

      # Reuse the open issue so a link that stays broken doesn't open a new issue every day.
      - id: open-issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 網址失效
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.open-issue.outputs.number }}

      - if: steps.lychee.outputs.exit_code == 0 && steps.open-issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.open-issue.outputs.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "所有網址都能正常開啟了。"
